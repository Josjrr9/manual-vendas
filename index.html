<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Manual do Consumidor | Seus direitos explicados passo a passo</title>
<meta name="description" content="O manual digital que explica, em linguagem simples, seus direitos como consumidor, os prazos da lei e o que fazer, com modelos prontos para preencher.">
<meta name="theme-color" content="#FFFFFF">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
<style>
/* ============ Tokens (estética escura: vazio preto, violeta de ação, âmbar de destaque) ============ */
:root{
  --vazio:#FFFFFF; --fundo-2:#F5F6F9; --texto:#14213D; --cinza:#5B6474; --prata:#3E4758; --sutil:rgba(20,33,61,.06); --sutil-2:rgba(20,33,61,.11);
  --iris:#A67C2E; --acafrao:#8C6A28; --acao:#14213D; --acao-hover:#22345C; --verde:#15846E; --sobre-ouro:#FFFFFF;
  --serifa:"Cormorant Garamond", "Times New Roman", Georgia, serif;
  --fonte:"Inter", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --raio:24px;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
/* A marca é escura nos dois modos do aparelho */
/* Visual claro nos dois modos do aparelho (identidade da marca) */
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --vazio:#FFFFFF; --texto:#14213D; } }
:root[data-theme="dark"]{ --vazio:#FFFFFF; --texto:#14213D; }
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 80px);scroll-behavior:smooth}
body{margin:0;background:var(--vazio);color:var(--texto);font-family:var(--fonte);font-weight:400;font-size:18px;line-height:1.5;font-feature-settings:"ss01";-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%}
button,input{font:inherit}
p{margin:0}
h1,h2,h3{margin:0;font-weight:500;font-family:var(--serifa)}
a{color:inherit}
img{max-width:100%}
:focus-visible{outline:2px solid var(--iris);outline-offset:3px}
.wrap{max-width:1280px;margin:0 auto;padding-left:24px;padding-right:24px}
.i{width:22px;height:22px;flex:none}

/* ============ Tipografia ============ */
.display{font-size:clamp(2.9rem,11.5vw,7.06rem);line-height:1;letter-spacing:-.02em}
.titulo{font-size:clamp(2.5rem,8.4vw,4.875rem);line-height:1.02;letter-spacing:-.02em;max-width:14em}
.titulo-sm{font-size:clamp(2rem,6vw,2.75rem);line-height:1.1;letter-spacing:-.01em}
.rotulo{display:inline-block;font-size:14px;font-weight:600;text-transform:uppercase;letter-spacing:.025em;color:var(--acafrao)}
.corpo{color:var(--prata);max-width:32em}
.corpo strong{color:var(--texto);font-weight:400}

/* ============ Botões ============ */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:999px;background:var(--acao);color:var(--sobre-ouro);font-size:14px;font-weight:600;text-transform:uppercase;letter-spacing:.025em;padding:16px 26px;min-height:52px;cursor:pointer;text-decoration:none;transition:background .15s,transform .12s}
.btn:hover{background:var(--acao-hover)}
.btn:active{transform:scale(.98)}
.btn.largo{width:100%}
.fantasma{background:none;border:0;color:var(--cinza);font-size:14px;font-weight:600;text-transform:uppercase;letter-spacing:.025em;cursor:pointer;padding:10px 4px;text-decoration:none}
.fantasma:hover{color:var(--acao)}

/* ============ Topo ============ */
header.topo{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:rgba(255,255,255,.96);box-shadow:0 1px 0 var(--sutil-2)}
.barra{display:flex;align-items:center;gap:22px;min-height:72px}
.logo{white-space:nowrap;display:flex;align-items:center;gap:10px;font-family:var(--serifa);font-weight:700;font-size:21px;letter-spacing:0;color:var(--texto);text-decoration:none}
.nav{display:none;gap:22px;margin-left:auto}
@media (min-width:900px){.nav{display:flex}}
.barra .direita{display:flex;align-items:center;gap:14px;margin-left:auto}
@media (min-width:900px){.barra .direita{margin-left:10px}}
.barra .btn{min-height:44px;padding:12px 20px}
@media (max-width:430px){.barra .btn{display:none}.logo{font-size:19px}}

/* ============ Hero ============ */
.hero{padding:40px 0 96px;background:linear-gradient(180deg,var(--fundo-2),#FFFFFF 80%)}
.hero-grid{display:grid;gap:40px;align-items:center}
@media (min-width:980px){.hero-grid{grid-template-columns:1.1fr .9fr;gap:56px}}
.hero .display{margin-top:18px;font-size:clamp(3rem,10vw,6rem)}
.hero .corpo{margin-top:26px;font-size:1.1rem}
.escolha{margin-top:36px}
.escolha > span{display:block;font-size:14px;font-weight:600;text-transform:uppercase;letter-spacing:.025em;color:var(--cinza);margin-bottom:14px}
.tags{display:flex;flex-wrap:wrap;gap:10px}
.tag{display:inline-flex;align-items:center;gap:10px;background:var(--sutil);border:0;border-radius:999px;color:var(--texto);font-size:16px;font-weight:400;padding:11px 18px 11px 12px;cursor:pointer;transition:background .15s,color .15s}
.tag .i{width:20px;height:20px;color:var(--iris)}
.tag:hover{background:var(--sutil-2);color:var(--acao)}
.tag.destaque{background:var(--acao);color:#FFFFFF}
.tag.destaque .i{color:var(--sobre-ouro)}
.cta-caso{margin-top:32px}
.confianca{display:flex;flex-wrap:wrap;gap:10px 24px;margin-top:30px;font-size:15px;color:var(--cinza)}
.confianca span{display:flex;align-items:center;gap:8px}
.confianca .i{width:17px;height:17px;color:var(--acafrao)}
.constelacao{position:relative;width:100%;aspect-ratio:1/0.95;max-height:640px}
.constelacao canvas{position:absolute;inset:0;width:100%;height:100%}
@media (max-width:979px){.constelacao{order:-1;aspect-ratio:1/0.55;max-height:220px;margin-bottom:-12px}.hero{padding-top:8px}}

/* ============ Seções ============ */
.secao{padding:96px 0}
.secao.alt{background:var(--fundo-2)}
@media (min-width:980px){.secao{padding:120px 0}}
.duas{display:grid;gap:48px}
@media (min-width:980px){.duas{grid-template-columns:1fr 1fr;gap:80px;align-items:start}}
.duas.centro{align-items:center}
.secao .corpo{margin-top:24px}

/* fatos */
.fatos{display:grid;gap:40px}
@media (min-width:860px){.fatos{grid-template-columns:repeat(3,1fr);gap:56px}}
.fatos strong{display:block;font-weight:400;font-family:var(--serifa);font-size:clamp(2.4rem,6vw,3rem);letter-spacing:-.04em;line-height:1;color:var(--acafrao)}
.fatos span{display:block;margin-top:12px;color:var(--prata)}

/* dores */
.citacao{font-family:var(--serifa);font-size:clamp(1.6rem,4.6vw,2.25rem);line-height:1.2;letter-spacing:-.03em;margin-top:30px}
.lista-dor{list-style:none;padding:0;margin:0;display:grid;gap:26px}
.lista-dor li{display:flex;gap:16px;align-items:flex-start;color:var(--prata);font-size:1.15rem}
.lista-dor .i{width:20px;height:20px;color:var(--cinza);margin-top:5px}
.numero-grande{margin-top:56px}
.numero-grande strong{display:block;font-weight:400;font-family:var(--serifa);font-size:clamp(3rem,10vw,4.875rem);letter-spacing:-.04em;line-height:1;color:var(--acafrao)}
.numero-grande p{margin-top:12px;color:var(--prata)}
.numero-grande a{color:var(--cinza);font-size:14px}

/* casos reais */
.faixa-casos{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(270px,82%);gap:48px;overflow-x:auto;scroll-snap-type:x mandatory;margin-top:56px;padding-bottom:18px;scrollbar-width:thin;scrollbar-color:var(--iris) transparent}
@media (min-width:860px){.faixa-casos{grid-auto-columns:calc((100% - 96px)/3)}}
.caso-real{scroll-snap-align:start;display:flex;flex-direction:column}
.cr-topo{display:flex;align-items:center;gap:10px;font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.025em;color:var(--cinza)}
.cr-topo .i{width:18px;height:18px;color:var(--iris)}
.cr-licao{font-family:var(--serifa);font-size:1.6rem;line-height:1.2;letter-spacing:-.02em;margin-top:18px}
.cr-decisao{margin-top:14px;font-size:15px;color:var(--acafrao)}
.cr-fato{margin-top:14px;color:var(--prata);font-size:16px}
.cr-fez{margin-top:20px;flex:1}
.cr-fez small{display:block;font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.025em;color:var(--iris);margin-bottom:6px}
.cr-fez p{font-size:16px}
.cr-fonte{display:inline-flex;align-items:center;gap:6px;margin-top:22px;font-size:13px;color:var(--cinza);text-decoration:none}
.cr-fonte .i{width:13px;height:13px}
.cr-fonte:hover{color:var(--texto)}
.aviso{margin-top:28px;font-size:14px;color:var(--cinza);max-width:56em}

/* em comum */
.lista-num{list-style:none;padding:0;margin:0;display:grid;gap:36px;counter-reset:n}
.lista-num li{display:grid;grid-template-columns:72px 1fr;gap:12px;align-items:start}
.lista-num li::before{counter-increment:n;content:counter(n,upper-roman);font-family:var(--serifa);font-size:3rem;letter-spacing:-.04em;line-height:1;color:var(--iris)}
.lista-num strong{display:block;font-weight:400;font-family:var(--serifa);font-size:1.5rem;letter-spacing:-.02em}
.lista-num span{display:block;color:var(--prata);margin-top:6px}
.ponte{margin-top:28px;color:var(--prata)}
.ponte strong{color:var(--acafrao);font-weight:400}

/* o que é / não é */
.lista-sn{list-style:none;padding:0;margin:26px 0 0;display:grid;gap:18px}
.lista-sn li{display:flex;gap:14px;align-items:flex-start;color:var(--prata)}
.lista-sn .i{width:20px;height:20px;margin-top:4px}
.lista-sn.sim .i{color:var(--iris)}
.lista-sn.nao .i{color:var(--cinza)}
.nota-lei{margin-top:48px;color:var(--cinza);font-size:15px;max-width:52em}

/* como funciona */
.passos{list-style:none;padding:0;margin:48px 0 0;display:grid;gap:44px;counter-reset:p}
.passos li{display:grid;grid-template-columns:72px 1fr;gap:12px}
.passos li::before{counter-increment:p;content:counter(p,upper-roman);font-family:var(--serifa);font-size:3rem;letter-spacing:-.04em;line-height:1;color:var(--acafrao)}
.passos h3{font-family:var(--serifa);font-size:1.6rem;letter-spacing:-.02em}
.passos p{color:var(--prata);margin-top:8px}
.celular{width:min(320px,82vw);margin:0 auto;background:#14213D;box-shadow:0 30px 60px -24px rgba(20,33,61,.45);border-radius:44px;padding:12px}
.tela-cel{background:#F4F6F5;border-radius:34px;overflow:hidden;color:#13202B;font-family:var(--fonte)}
.cel-topo{background:#14213D;color:#fff;padding:24px 18px 16px}
.cel-topo small{display:block;font-size:11px;color:#AEB6C6}
.cel-topo b{font-weight:600;font-size:16px}
.cel-corpo{padding:16px}
.carimbo{display:inline-block;font-family:"Cormorant Garamond",Georgia,serif;font-weight:700;color:#8A6A2E;border:3px double #8A6A2E;border-radius:6px;padding:5px 12px;font-size:15px;transform:rotate(-4deg)}
.cel-barra{height:7px;background:#DDE2DF;border-radius:5px;margin:14px 0 4px;overflow:hidden}
.cel-barra i{display:block;width:83%;height:100%;background:#B8904A}
.cel-legenda{font-size:11px;color:#55616D}
.cel-linha{padding:10px 0;border-top:1px solid #DDE2DF;font-size:13px}
.cel-linha small{display:block;color:#55616D;font-size:11px}
.cel-linha b{font-weight:600;background:linear-gradient(transparent 58%,#EFD9A6 58%)}
.cel-prox{background:#F3EAD6;border-radius:12px;padding:10px 12px;font-size:12.5px;margin-top:6px}
.cel-prox small{display:block;color:#8A6A2E;font-weight:600;font-size:11px}

/* benefícios */
.beneficios{list-style:none;padding:0;margin:56px 0 0;display:grid;gap:44px}
@media (min-width:700px){.beneficios{grid-template-columns:1fr 1fr}}
@media (min-width:1040px){.beneficios{grid-template-columns:repeat(3,1fr);gap:56px}}
.beneficios .i{width:28px;height:28px;color:var(--iris)}
.beneficios strong{display:block;font-weight:400;font-family:var(--serifa);font-size:1.5rem;letter-spacing:-.02em;margin-top:16px}
.beneficios span{display:block;color:var(--prata);margin-top:8px}

/* preço */
.valor{font-family:var(--serifa);font-size:clamp(4rem,16vw,7.06rem);letter-spacing:-.04em;line-height:1;margin-top:22px}
.valor em{font-style:normal;font-size:1.2rem;letter-spacing:0;color:var(--cinza)}
.inclui{list-style:none;padding:0;margin:30px 0 0;display:grid;gap:14px}
.inclui li{display:flex;gap:12px;align-items:flex-start;color:var(--prata)}
.inclui .i{width:20px;height:20px;color:var(--iris);margin-top:4px}
.garantia-num{font-family:var(--serifa);font-size:clamp(3rem,10vw,4.875rem);letter-spacing:-.04em;line-height:1;color:var(--acafrao)}
.garantia h3{font-size:1.6rem;letter-spacing:-.02em;margin-top:14px}
.garantia p{color:var(--prata);margin-top:12px}
.garantia .btn{margin-top:32px}

/* faq */
.faqs{margin-top:48px;display:grid;gap:0;max-width:900px;border-top:1px solid var(--sutil-2)}
.faq{border-bottom:1px solid var(--sutil-2)}
.faq summary{list-style:none;font-family:var(--serifa);cursor:pointer;display:flex;justify-content:space-between;gap:24px;padding:18px 0;font-size:clamp(1.2rem,3.4vw,1.5rem);letter-spacing:-.02em}
.faq summary::-webkit-details-marker{display:none}
.faq summary::after{content:"+";color:var(--iris);font-size:1.8rem;line-height:1}
.faq[open] summary::after{content:"\2013"}
.faq summary:hover{color:var(--iris)}
.faq p{color:var(--prata);padding:0 0 22px;max-width:46em}

/* final */
.final{padding:120px 0 96px;text-align:center;background:var(--fundo-2)}
.final .titulo{margin:0 auto}
.final .corpo{margin:24px auto 0}
.final .tags{justify-content:center;margin-top:36px}
.rodape{padding:48px 0 120px;color:var(--cinza);font-size:14px}
.rodape p + p{margin-top:12px}
.rodape button{background:none;border:0;padding:0;color:var(--acao);cursor:pointer;font-size:14px;text-decoration:underline}

/* barra fixa no celular */
.barra-fixa{position:fixed;left:0;right:0;bottom:0;z-index:30;background:#FFFFFF;box-shadow:0 -6px 20px rgba(20,33,61,.1);padding:12px 18px calc(12px + env(safe-area-inset-bottom,0px));display:flex;align-items:center;gap:12px;transform:translateY(110%);transition:transform .25s}
.barra-fixa.on{transform:none}
.barra-fixa div{font-size:13px;color:var(--cinza);line-height:1.3}
.barra-fixa div b{display:block;color:var(--texto);font-family:var(--serifa);font-weight:600;font-size:20px}
.barra-fixa .btn{margin-left:auto;min-height:46px;padding:12px 20px}
@media (min-width:980px){.barra-fixa{display:none}}

/* cookies e privacidade */
.cookies{position:fixed;left:0;right:0;bottom:0;z-index:50;background:#FFFFFF;box-shadow:0 -8px 24px rgba(20,33,61,.14);padding:18px 0 calc(18px + env(safe-area-inset-bottom,0px))}
.cookies p{margin:0 0 12px;font-size:15px;color:var(--prata)}
.cookies .texto-btn{background:none;border:0;padding:0;color:var(--acao);font-size:15px;text-decoration:underline;cursor:pointer}
.cookies-botoes{display:flex;gap:10px}
.cookies-botoes .btn{flex:1;min-height:46px;padding:10px}
.cookies-botoes .btn.sec{background:var(--sutil-2);color:var(--texto)}
.politica{max-width:720px;padding-top:40px;padding-bottom:80px}
.politica .tela-titulo{font-size:clamp(2.2rem,8vw,3.5rem);letter-spacing:-.04em;line-height:1.05}
.politica h2{font-size:1.4rem;letter-spacing:-.02em;margin:34px 0 6px}
.politica p{color:var(--prata)}
.politica .dica{margin-top:14px}
.politica .texto-btn{background:none;border:0;padding:0;color:var(--texto);text-decoration:underline;cursor:pointer}
.politica .botoes{margin-top:36px}
.politica .btn.sec{background:var(--sutil-2);color:var(--texto)}

/* botão principal em destaque */
.btn.assinar{background:#C9A45C;color:#14213D;font-size:16px;letter-spacing:.04em;min-height:62px;padding:18px 34px;box-shadow:0 12px 26px -10px rgba(166,124,46,.75)}
.btn.assinar:hover{background:#D6B571}
.btn{white-space:nowrap}
.btn.topo-btn{min-height:46px;padding:12px 22px;font-size:13px;box-shadow:none}
.btn.barra-btn{min-height:50px;padding:12px 20px;font-size:14px;box-shadow:none}
@media (max-width:430px){.barra .btn.topo-btn{display:inline-flex;min-height:40px;padding:10px 14px;font-size:12px}.logo{font-size:16px}.barra{gap:10px}.wrap.barra{padding-left:16px;padding-right:16px}.logo span{width:24px!important;height:24px!important}}
@media (max-width:600px){.hero-assinar .btn.assinar,.cta-secao .btn.assinar{width:100%}}
.cta-secao{display:flex;flex-direction:column;align-items:flex-start;gap:12px;margin-top:40px}
.cta-secao.centro{align-items:center;text-align:center}
.cta-secao small{color:var(--cinza);font-size:15px}
.cta-secao small b{color:var(--texto);font-weight:600}
.tag.limpar{background:transparent;color:var(--cinza);text-decoration:underline;padding-left:14px}

/* preço de lançamento e contagem regressiva */
.faixa-promo{background:#14213D;color:#FFFFFF;font-size:14px}
.faixa-in{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:6px 16px;min-height:44px;padding-top:8px;padding-bottom:8px;text-align:center}
.faixa-in b{font-weight:600}
.relogio{color:#E6C98A;font-weight:600;font-variant-numeric:tabular-nums}
.btn.mini{min-height:34px;padding:6px 16px;font-size:12px;background:#C9A45C;color:#14213D}
.btn.mini:hover{background:#D8B878}
@media (max-width:600px){.faixa-promo .btn.mini{display:none}.faixa-in{font-size:12.5px;gap:2px 10px;min-height:0}}
.barra-fixa .btn{white-space:nowrap}
.hero-assinar{display:flex;flex-direction:column;align-items:flex-start;gap:12px;margin-top:34px}
.hero-assinar small{color:var(--cinza);font-size:15px}
.hero-assinar small b{color:var(--texto);font-weight:600}
.contagem-grande{display:flex;gap:10px;margin-top:22px}
.contagem-grande div{background:var(--fundo-2);border-radius:14px;padding:12px 10px;min-width:70px;text-align:center}
.contagem-grande b{display:block;font-family:var(--serifa);font-weight:600;font-size:2.1rem;line-height:1;font-variant-numeric:tabular-nums}
.contagem-grande small{display:block;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.04em;color:var(--cinza);margin-top:4px}
.vitalicio{margin-top:8px;font-family:var(--serifa);font-size:1.6rem;color:var(--acafrao)}
.depois{margin-top:10px;color:var(--cinza)}
.depois b{color:var(--texto);font-weight:600}
.selo-lancamento{display:inline-block;background:#F3EAD6;color:#8C6A28;border-radius:999px;padding:6px 14px;font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.03em;margin-top:18px}

/* histórias de exemplo e depoimentos */
.selo-ficticio{display:inline-block;margin-top:16px;background:#F3EAD6;color:#6E5320;border-radius:10px;padding:8px 14px;font-size:14px;font-weight:600}
.historias{display:grid;gap:20px;margin-top:40px}
@media (min-width:900px){.historias{grid-template-columns:repeat(3,1fr)}}
.historia{background:#FFFFFF;border-radius:20px;padding:24px;box-shadow:0 1px 2px rgba(20,33,61,.06),0 14px 34px -22px rgba(20,33,61,.35)}
.hist-topo{display:flex;align-items:center;gap:14px}
.avatar{width:52px;height:52px;border-radius:50%;background:#14213D;color:#E6C98A;display:grid;place-items:center;font-family:var(--serifa);font-weight:700;font-size:1.6rem;flex:none}
.hist-topo strong{display:block;font-family:var(--serifa);font-weight:600;font-size:1.5rem;line-height:1.1}
.hist-topo div span{display:flex;align-items:center;gap:6px;font-size:14px;color:var(--cinza)}
.hist-topo div span .i{width:16px;height:16px;color:var(--iris)}
.historia dl{margin:18px 0 0}
.historia dl > div{padding:14px 0;border-top:1px solid var(--sutil-2)}
.historia dt{font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.04em;color:var(--acafrao);margin-bottom:6px}
.historia dd{margin:0;color:var(--prata);font-size:16px}
.historia ul{list-style:none;padding:0;margin:0;display:grid;gap:8px}
.historia li{display:flex;gap:8px;align-items:flex-start}
.historia li .i{width:18px;height:18px;color:var(--iris);margin-top:3px}
.depoimentos{display:grid;gap:20px;margin-top:40px}
@media (min-width:900px){.depoimentos{grid-template-columns:repeat(3,1fr)}}
.depo{margin:0;background:var(--fundo-2);border-radius:20px;padding:26px}
.depo blockquote{margin:0;font-family:var(--serifa);font-size:1.35rem;line-height:1.35}
.depo figcaption{margin-top:16px;font-size:14px;color:var(--cinza)}
.depo figcaption strong{display:block;color:var(--texto);font-weight:600;font-size:15px}

/* notificações */
.toast{position:fixed;left:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:40;display:flex;gap:12px;align-items:flex-start;max-width:min(380px,calc(100vw - 32px));background:#FFFFFF;border-radius:16px;padding:14px 14px 14px 14px;box-shadow:0 18px 40px -12px rgba(20,33,61,.35),0 0 0 1px rgba(20,33,61,.06);transform:translateY(20px);opacity:0;pointer-events:none;transition:opacity .3s,transform .3s}
.toast.on{opacity:1;transform:none;pointer-events:auto}
.toast-ic{flex:none;width:38px;height:38px;border-radius:12px;background:#F3EAD6;color:#8C6A28;display:grid;place-items:center}
.toast-ic .i{width:20px;height:20px}
.toast strong{display:block;font-size:15px;font-weight:600;color:var(--texto)}
.toast div span{display:block;font-size:14px;color:var(--cinza);line-height:1.4;margin-top:2px}
.toast-x{flex:none;background:none;border:0;color:var(--cinza);cursor:pointer;padding:2px;margin-left:2px}
.toast-x .i{width:16px;height:16px}
@media (max-width:979px){.toast{bottom:calc(92px + env(safe-area-inset-bottom,0px))}}
@media (prefers-reduced-motion:reduce){.toast{transition:none}}

/* ilustrações jurídicas */
.arte{color:var(--iris);width:100%;max-width:420px}
.arte svg{width:100%;height:auto;display:block}
.arte.pequena{max-width:260px}
.cabeca-secao{display:grid;gap:32px;align-items:end}
@media (min-width:980px){.cabeca-secao{grid-template-columns:1fr auto}}
.cabeca-secao .arte{max-width:300px}
.paragrafo{font-family:var(--serifa);color:var(--iris);font-size:1.1em;margin-right:6px}
.filete{display:flex;align-items:center;gap:18px;color:var(--iris);margin:0 auto;max-width:1232px;padding:0 24px}
.filete::before,.filete::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,transparent,rgba(201,164,92,.45),transparent)}
.filete svg{width:28px;height:28px}
.selo-garantia{width:150px;height:150px;color:var(--iris)}

@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}.btn,.barra-fixa,.tag{transition:none}}

/* ====== PREÇO DE LANÇAMENTO E CONTAGEM REGRESSIVA ======
   A contagem vai até uma data REAL (FIM_PROMOCAO), igual para todo mundo.
   Quando a data passa, a página mostra sozinha o preço normal (PRECO_DEPOIS). */
function promoAtiva(){ return Date.now() < new Date(FIM_PROMOCAO).getTime(); }
function precoAtual(){ return promoAtiva() ? PRECO : PRECO_DEPOIS; }
function dataFimPromo(){ const [a,m,d]=FIM_PROMOCAO.slice(0,10).split('-'); return `${d}/${m}/${a}`; }
// Monta o link de pagamento levando junto as marcações dos anúncios (utm, src, sck)
function linkPagamento(){
  const u=new URL(LINK_CHECKOUT); const atual=new URLSearchParams(location.search);
  atual.forEach((v,k)=>{ if(/^(utm_|src$|sck$|fbclid$|gclid$)/.test(k)) u.searchParams.set(k,v); });
  return u.toString();
}
function abrirPagamento(){
  const u=linkPagamento();
  if(window.self!==window.top) window.open(u,'_blank','noopener'); else location.href=u;
}
function assinar(){
  const lp=paginaAnuncio(); rastrear('checkout',{value:29.90,currency:'BRL'});
  if(LINK_CHECKOUT) abrirPagamento();                            // página de pagamento (Kiwify)
}
let casoAtual = casoAnuncio;
function escolherProblema(k){
  casoAtual = (k&&LP[k]) ? k : null;
  const url = location.pathname + (casoAtual?`?caso=${casoAtual}`:'');
  try{ history.replaceState(null,'',url); }catch(e){}
  const y=window.scrollY; render(); window.scrollTo(0,y);
}

function faixaPromo(){
  if(!promoAtiva()) return '';
  return `<div class="faixa-promo"><div class="wrap faixa-in">
    <span><b>Acesso vitalício por ${PRECO}</b>, pagamento único, até ${dataFimPromo()}. Depois, ${PRECO_DEPOIS}.</span>
    <span class="relogio" data-contagem>Termina em --</span>
    <button class="btn mini" onclick="assinar()">Garantir acesso</button>
  </div></div>`;
}
function contagemGrande(){
  if(!promoAtiva()) return '';
  return `<div class="contagem-grande" data-contagem-grande aria-live="off">
    <div><b data-d>--</b><small>dias</small></div><div><b data-h>--</b><small>horas</small></div>
    <div><b data-m>--</b><small>min</small></div><div><b data-s>--</b><small>seg</small></div></div>`;
}
let timerPromo=null;
function atualizarContagem(){
  const r=new Date(FIM_PROMOCAO).getTime()-Date.now();
  if(r<=0){ clearInterval(timerPromo); timerPromo=null; render(); return; }
  const p=n=>String(n).padStart(2,'0');
  const d=Math.floor(r/864e5), h=Math.floor(r/36e5)%24, m=Math.floor(r/6e4)%60, s=Math.floor(r/1e3)%60;
  document.querySelectorAll('[data-contagem]').forEach(e=>e.textContent=`Termina em ${d}d ${p(h)}h ${p(m)}m ${p(s)}s`);
  document.querySelectorAll('[data-contagem-grande]').forEach(e=>{
    e.querySelector('[data-d]').textContent=p(d); e.querySelector('[data-h]').textContent=p(h);
    e.querySelector('[data-m]').textContent=p(m); e.querySelector('[data-s]').textContent=p(s);
  });
}
function ligarContagem(){
  clearInterval(timerPromo); timerPromo=null;
  if(promoAtiva()){ atualizarContagem(); timerPromo=setInterval(atualizarContagem,1000); }
}

function avisosVerdadeiros(){
  const lista=[];
  if(promoAtiva()) lista.push([IC.relogio,'Preço de lançamento',`Acesso vitalício por ${PRECO} até ${dataFimPromo()}. Depois, ${PRECO_DEPOIS}.`]);

function tempoAtras(iso){
  const m=Math.max(1,Math.round((Date.now()-new Date(iso).getTime())/60000));
  return m<60?`há ${m} min`:m<1440?`há ${Math.round(m/60)} h`:`há ${Math.round(m/1440)} dia(s)`;
}
async function carregarComprasReais(){
  if(!FONTE_COMPRAS_REAIS) return;
  try{ const r=await fetch(FONTE_COMPRAS_REAIS,{cache:'no-store'}); if(r.ok) comprasReais=[...COMPRAS_REAIS,...(await r.json())].filter(c=>c&&c.nome&&c.quando).slice(0,20); }catch(e){}
}
let toastTimer=null, toastIdx=0, toastMostrados=0, toastFechado=false;
function mostrarToast(){
  if(toastFechado||tela!=='inicio'||document.hidden) return;
  if(toastMostrados>=8) return;
  const fila=[...comprasReais.map(c=>[IC.pessoa,`${c.nome}${c.cidade?', de '+c.cidade:''}`,`garantiu o acesso vitalício ${tempoAtras(c.quando)}.`]),...avisosVerdadeiros()];
  if(!fila.length) return;
  const [ic,t,d]=fila[toastIdx%fila.length]; toastIdx++; toastMostrados++;
  let el=$('toast'); if(!el){ el=document.createElement('div'); el.id='toast'; el.className='toast'; el.setAttribute('role','status'); el.setAttribute('aria-live','polite'); document.body.appendChild(el); }
  el.innerHTML=`<span class="toast-ic">${ic}</span><div><strong>${esc(t)}</strong><span>${esc(d)}</span></div><button class="toast-x" aria-label="Fechar avisos" onclick="fecharToasts()">${IC.nao}</button>`;
  el.classList.add('on');
  setTimeout(()=>el.classList.remove('on'),6500);
}
function fecharToasts(){ toastFechado=true; const el=$('toast'); if(el) el.classList.remove('on'); clearInterval(toastTimer); }
function ligarToasts(){
  if(toastTimer) return;
  carregarComprasReais();
  setTimeout(mostrarToast,7000);
  toastTimer=setInterval(mostrarToast,22000);
}

/* ====== CONSTELAÇÃO: a balança da justiça feita de pequenos triângulos dourados ====== */
let pararCeu=null;
function iniciarCeu(){
  if(pararCeu){pararCeu();pararCeu=null;}
  const cv=$('ceu'); if(!cv) return;
  const ctx=cv.getContext('2d'); if(!ctx) return;
  const cores=['#A67C2E','#8C6A28','#B8904A','#14213D','#2E4A7D','#A67C2E','#8C6A28'];
  const reduz=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
  let W=0,H=0,dpr=1,parts=[];
  const rnd=(a,b)=>a+Math.random()*(b-a);
  const PIV=-0.50, BR=0.74, CAI=0.46;   // altura do eixo, meio braço, queda até o prato
  function gerar(){
    parts=[]; const f=W<600?0.8:1.35;
    const add=(o)=>parts.push(Object.assign({s:rnd(2,4.6),r:rnd(0,6.3),vr:rnd(-0.4,0.4),c:cores[(Math.random()*cores.length)|0],f:rnd(0,6.3),a:rnd(0.8,1)},o));
    const J=()=>rnd(-0.012,0.012);
    for(let i=0;i<150*f;i++) add({t:'fixo',x:J()*1.4,y:rnd(PIV,0.66)});                       // coluna
    for(let i=0;i<50*f;i++){const g=rnd(0,6.3);add({t:'fixo',x:Math.cos(g)*0.055+J()*.3,y:PIV-0.12+Math.sin(g)*0.055});} // remate
    for(let i=0;i<170*f;i++) add({t:'viga',lx:rnd(-BR,BR),ly:J()});                               // braço
    for(const lado of [-1,1]){
      for(let i=0;i<140*f;i++){const k=Math.random(), q=Math.random()<.5?-1:1;               // correntes
        add({t:'pend',lado,dx:q*0.2*k+J(),dy:CAI*k});}
      for(let i=0;i<170*f;i++){const g=rnd(0,Math.PI);                                           // prato
        const borda=Math.random()<.35; add({t:'pend',lado,dx:(borda?rnd(-0.22,0.22):Math.cos(g)*0.22)+J(),dy:CAI+(borda?J():Math.sin(g)*0.1)});}
    }
    for(let i=0;i<150*f;i++){const k=Math.random();                                             // base
      const lin=Math.random(); let x,y;
      if(lin<.4){x=rnd(-0.34,0.34);y=0.78;} else if(lin<.7){x=rnd(-0.2,0.2);y=0.68;} else {const q=Math.random()<.5?-1:1; x=q*(0.2+0.14*k); y=0.68+0.1*k;}
      add({t:'fixo',x:x+J(),y:y+J()});}
    const A=W<600?50:110;
    for(let i=0;i<A;i++) add({t:'amb',x:rnd(-1.4,1.4),y:rnd(-1,1),a:rnd(0.1,0.28),s:rnd(1.2,2.4)});
  }
  function medir(){
    const r=cv.getBoundingClientRect(); dpr=Math.min(window.devicePixelRatio||1,2);
    W=r.width; H=r.height; cv.width=Math.round(W*dpr); cv.height=Math.round(H*dpr); ctx.setTransform(dpr,0,0,dpr,0,0); gerar();
  }
  function tri(x,y,s,r){ctx.beginPath();for(let k=0;k<3;k++){const g=r+k*2.094;const px=x+Math.cos(g)*s,py=y+Math.sin(g)*s;k?ctx.lineTo(px,py):ctx.moveTo(px,py);}ctx.closePath();ctx.stroke();}
  let rodando=true,t0=performance.now(),raf=0;
  function desenhar(agora){
    const t=(agora-t0)/1000; ctx.clearRect(0,0,W,H);
    const esc=Math.min(W*0.5,H*0.5), cx=W/2, cy=H*0.52;
    const th=reduz?0.04:0.07*Math.sin(t*0.6), c=Math.cos(th), sn=Math.sin(th);
    ctx.lineWidth=1.4;
    for(const p of parts){
      let x,y;
      if(p.t==='viga'){x=p.lx*c-p.ly*sn; y=PIV+p.lx*sn+p.ly*c;}
      else if(p.t==='pend'){const ex=p.lado*BR*c, ey=PIV+p.lado*BR*sn; x=ex+p.dx; y=ey+p.dy;}
      else {x=p.x;y=p.y;}
      const jx=reduz?0:Math.sin(t*0.8+p.f)*(p.t==='amb'?4:1.2), jy=reduz?0:Math.cos(t*0.7+p.f)*(p.t==='amb'?4:1.2);
      ctx.globalAlpha=reduz?p.a:p.a*(0.72+0.28*Math.sin(t*1.4+p.f*2)); ctx.strokeStyle=p.c;
      tri(cx+x*esc+jx, cy+y*esc+jy, p.s, p.r+(reduz?0:t*p.vr));
    }
    ctx.globalAlpha=1;
    if(rodando&&!reduz) raf=requestAnimationFrame(desenhar);
  }
  medir(); desenhar(performance.now());
  const ro=('ResizeObserver' in window)?new ResizeObserver(()=>{medir(); if(reduz) desenhar(performance.now());}):null; if(ro) ro.observe(cv);
  const io=('IntersectionObserver' in window)?new IntersectionObserver(([e])=>{rodando=e.isIntersecting;cancelAnimationFrame(raf);if(rodando&&!reduz) raf=requestAnimationFrame(desenhar);}):null; if(io) io.observe(cv);
  pararCeu=()=>{rodando=false;cancelAnimationFrame(raf);if(ro)ro.disconnect();if(io)io.disconnect();};
}

function render(){
  topo();
  $('app').innerHTML = tela==='privacidade' ? telaPrivacidade() : telaInicio();
  barraFixa();
  if(tela!=='privacidade') iniciarCeu(); else if(pararCeu){pararCeu();pararCeu=null;}
  ligarContagem();
  if(tela==='inicio') ligarToasts();
